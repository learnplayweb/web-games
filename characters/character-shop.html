<!-- v0.1.13 : 
 렌더러가 쉽게 조작할 수 있도록 placeholder-outline/text 클래스 추가 -->


<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>캐릭터 상점</title>
  <link rel="stylesheet" href="../shared/header.css" />
  <link rel="stylesheet" href="character-shop.css" />
</head>
<body>

  <div class="shop-wrapper">

    <!-- ① 캐릭터 영역 -->
    <section class="character-area">
      <!-- 더미 플레이스홀더 SVG (실제 렌더링은 characterRenderer.js가 관리) -->
      <svg class="character-placeholder" viewBox="0 0 160 300" xmlns="http://www.w3.org/2000/svg">
      </svg>
      <p class="character-name">아직 꼬무리가 없어요</p>
    </section>

    <!-- ② 기능 버튼 섹션 -->
    <section class="shop-section">
      <div class="shop-section__header" style="padding-bottom:0;"></div>
      <div class="shop-section__body">
        <ul class="action-list">
          <li class="action-item">
            <button type="button" class="action-item__btn" id="btn-combine">
              <span>조합</span><span class="action-item__price">💎 50</span>
            </button>
          </li>
          <li class="action-item">
            <button type="button" class="action-item__btn" id="btn-dismantle">
              <span>해체</span><span class="action-item__price">💎 50</span>
            </button>
          </li>
          <li class="action-item">
            <button type="button" class="action-item__btn" id="btn-rename">
              <span>이름 변경</span><span class="action-item__price">💎 10</span>
            </button>
          </li>
          <li class="action-item action-item--save">
            <button type="button" class="action-item__btn" id="btn-save">캐릭터 저장하기</button>
          </li>
        </ul>
      </div>
    </section>

    <!-- ③ 파츠 섹션 (기본 펼침) -->
    <section class="shop-section">
      <div class="shop-section__header">꼬무리</div>
      <div class="shop-section__body" id="parts-body">
        <div class="parts-grid">
          <!-- 슬롯 1~8 유지 -->
          <div class="part-slot part-slot--locked" data-part="1" data-name="원" data-owned="0"><svg class="part-slot__svg" viewBox="0 0 56 56"></svg></div>
          <div class="part-slot part-slot--locked" data-part="2" data-name="세모" data-owned="0"><svg class="part-slot__svg" viewBox="0 0 56 56"></svg></div>
          <div class="part-slot part-slot--locked" data-part="3" data-name="네모" data-owned="0"><svg class="part-slot__svg" viewBox="0 0 56 56"></svg></div>
          <div class="part-slot part-slot--locked" data-part="4" data-name="마름모" data-owned="0"><svg class="part-slot__svg" viewBox="0 0 56 56"></svg></div>
          <div class="part-slot part-slot--locked" data-part="5" data-name="별" data-owned="0"><svg class="part-slot__svg" viewBox="0 0 56 56"></svg></div>
          <div class="part-slot part-slot--locked" data-part="6" data-name="럭비공" data-owned="0"><svg class="part-slot__svg" viewBox="0 0 56 56"></svg></div>
          <div class="part-slot part-slot--locked" data-part="7" data-name="역세모" data-owned="0"><svg class="part-slot__svg" viewBox="0 0 56 56"></svg></div>
          <div class="part-slot" data-part="random" data-name="랜덤 박스">
            <svg class="part-slot__svg" viewBox="0 0 56 56">
              <rect x="7" y="7" width="42" height="42" rx="8" fill="none" stroke="#b0bac6" stroke-width="2.5"/>
              <text x="28" y="34" font-size="18" text-anchor="middle" fill="#b0bac6">?</text>
            </svg>
          </div>
        </div>
      </div>
    </section>

    <!-- ④ 색상 섹션 (기본 접힘) -->
    <section class="shop-section">
      <div class="shop-section__header">
        색상
        <button type="button" class="shop-section__toggle" id="toggle-color" aria-expanded="false" aria-controls="color-body">▼</button>
      </div>
      <div class="shop-section__body shop-section__body--hidden" id="color-body">
        <div class="color-grid">
          <button type="button" class="color-slot" data-color="#FFCCBC" style="background:#ffccbc;" aria-label="빨강"></button>
          <button type="button" class="color-slot" data-color="#FCE8B2" style="background:#FCE8B2;" aria-label="주황"></button>
          <button type="button" class="color-slot" data-color="#ffffba" style="background:#ffffba;" aria-label="노랑"></button>
          <button type="button" class="color-slot" data-color="#d0ebaf" style="background:#d0ebaf;" aria-label="연두"></button>
          <button type="button" class="color-slot" data-color="#ACC9FE" style="background:#ACC9FE;" aria-label="파랑"></button>
          <button type="button" class="color-slot" data-color="#cdccfa" style="background:#cdccfa;" aria-label="청보라"></button>
          <button type="button" class="color-slot" data-color="#ffe4ef" style="background:#ffe4ef;" aria-label="연분홍"></button>
          <button type="button" class="color-slot" data-color="#ebd0fa" style="background:#ebd0fa;" aria-label="자색"></button>
          <button type="button" class="color-slot" data-color="#A2E8F1" style="background:#A2E8F1;" aria-label="민트"></button>
          <button type="button" class="color-slot" data-color="#96d3ce" style="background:#96d3ce;" aria-label="틸"></button>
          <button type="button" class="color-slot" data-color="#c0e2f1" style="background:#c0e2f1;" aria-label="연파랑"></button>
          <button type="button" class="color-slot color-slot--random" data-color="random" aria-label="랜덤 색상">?</button>
        </div>
        <button type="button" class="color-mix-btn">색 섞기 <span>💎 50</span></button>
      </div>
    </section>

    <!-- ⑤ 효과 섹션 (기본 접힘, 기능 예약) -->
    <section class="shop-section">
      <div class="shop-section__header">
        효과
        <button type="button" class="shop-section__toggle" id="toggle-decoration" aria-expanded="false" aria-controls="decoration-body">▼</button>
      </div>
      <div class="shop-section__body shop-section__body--hidden" id="decoration-body">
        <p style="color:var(--color-text-muted); font-size:0.9rem; padding: 0.5rem 0;">효과 구입은 추후 업데이트 예정입니다.</p>
      </div>
    </section>
  </div>

  <!-- 각종 모달 -->
  <div id="part-modal" class="modal-overlay modal-overlay--hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div id="part-modal-svg" class="part-modal__preview"></div>
      <p id="part-modal-name" class="part-modal__name"></p>
      <div id="part-modal-actions" class="modal-card__actions"></div>
    </div>
  </div>

  <div id="color-modal" class="modal-overlay modal-overlay--hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <div id="color-modal-preview" class="part-modal__preview"></div>
      <div id="color-modal-actions" class="modal-card__actions"></div>
    </div>
  </div>

  <div id="save-modal" class="modal-overlay modal-overlay--hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <p class="modal-card__msg">캐릭터의 정보를<br>기기에 저장합니다.</p>
      <div class="modal-card__actions">
        <button type="button" class="modal-card__btn modal-card__btn--confirm" id="modal-confirm">저장</button>
        <button type="button" class="modal-card__btn modal-card__btn--cancel" id="modal-cancel">취소</button>
      </div>
    </div>
  </div>

  <div id="name-modal" class="modal-overlay modal-overlay--hidden" role="dialog" aria-modal="true">
    <div class="modal-card">
      <p class="name-modal__title">이름을 정해 주세요</p>
      <input type="text" id="name-modal-input" class="name-modal__input" placeholder="10글자까지 가능합니다." maxlength="10" autocomplete="off">
      <div class="modal-card__actions">
        <button type="button" class="modal-card__btn modal-card__btn--confirm" id="name-modal-save" disabled>저장</button>
      </div>
    </div>
  </div>

  <script type="module" src="character-shop.js"></script>
</body>
</html>
