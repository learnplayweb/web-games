<!-- v0.1.6 : 맞춤법 모험 카드 조건부 활성화(캐릭터 등록 시) + 안내 모달 추가, 게임 이름/설명 반영 -->
<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Web Games</title>
  <link rel="stylesheet" href="shared/header.css" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 전체 페이지를 감싸는 래퍼 (PC 가운데 정렬용) -->
  <div class="wrapper">

    <!-- 헤더 영역: 제목 + 설명 -->
    <header class="site-header">
      <h1 class="site-title">꼬무리 마을</h1>
      <p class="site-desc">게임을 하며 꼬무리를 키워 보세요!</p>
    </header>

    <!-- 상단 퀵버튼: 캐릭터 상점 + 도움말 (게임 카드 절반 높이) -->
    <nav class="quick-grid">
      <a href="characters/character-shop.html" class="quick-btn quick-btn--active">
        <span class="quick-btn__icon">🧸</span>
        <span class="quick-btn__label">캐릭터 상점</span>
      </a>
      <button type="button" class="quick-btn quick-btn--soon" id="btn-help">
        <span class="quick-btn__icon">❓</span>
        <span class="quick-btn__label">도움말</span>
      </button>
    </nav>

    <!-- 게임 카드 목록 -->
    <main class="card-grid">

      <!-- 시계 읽기: 단계 선택 화면으로 이동 -->
      <a href="games/clock/select.html" class="card card--active">
        <div class="card__icon" aria-hidden="true">🕐</div>
        <h2 class="card__title">시계 읽기</h2>
        <p class="card__desc">시계를 보고 시각을 맞혀보세요</p>
        <span class="card__badge card__badge--play">Play</span>
      </a>

      <!-- 맞춤법 모험: 캐릭터 등록 여부에 따라 index.js가 활성/비활성 클래스를 토글 (기본은 잠김 상태) -->
      <a href="games/spelling/select.html" class="card card--soon" id="card-spelling" aria-disabled="true">
        <div class="card__icon" aria-hidden="true">✏️</div>
        <h2 class="card__title">맞춤법 모험</h2>
        <p class="card__desc">올바른 맞춤법을 골라보세요</p>
        <span class="card__badge card__badge--soon" id="card-spelling-badge">Locked</span>
      </a>

      <!-- 선 잇기: 아직 준비 중 (항상 마지막 위치 유지) -->
      <div class="card card--soon" aria-disabled="true">
        <div class="card__icon" aria-hidden="true">🔢</div>
        <h2 class="card__title">선 잇기</h2>
        <p class="card__desc">순서대로 연결해보세요</p>
        <span class="card__badge card__badge--soon">Coming Soon</span>
      </div>

    </main>

  </div><!-- /.wrapper -->

  <!-- 잠김 안내 모달: hidden 속성으로 표시/숨김 제어 -->
  <div class="modal-overlay" id="lock-modal" hidden>
    <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="lock-modal-text">
      <p class="modal-card__text" id="lock-modal-text">나의 꼬무리가 있어야 해요.</p>
      <button type="button" class="modal-card__btn" id="lock-modal-close">확인</button>
    </div>
  </div>

  <script type="module" src="index.js"></script>

</body>
</html>
