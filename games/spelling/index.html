<!-- v0.6.0
 Spelling Game - 판정/좌우 배치/갈림길 UI/마당 종료 구현
 - front 슬롯을 fork-row(board-front-left/right)로 분리, 일반 블록일 땐 right를 숨겨 단일 블록처럼 표시
 - 학습 모달(learning-modal), 마당 완료/실패 오버레이(stage-result) 추가 -->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spelling Game</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../../characters/character-anim.css" />
</head>
<body>

  <div id="game-wrapper" class="game-wrapper">

    <!-- 상단 정보 영역 : Combo(좌) / 하트(우) -->
    <header class="info-bar">
      <span class="info-bar__item info-bar__combo">
        <span class="info-bar__icon">🔥</span>
        <span id="display-combo" class="info-bar__value">0</span>
      </span>
      <span class="info-bar__item info-bar__hearts" id="display-hearts">
        <span class="heart" data-index="1">❤️</span>
        <span class="heart" data-index="2">❤️</span>
        <span class="heart" data-index="3">❤️</span>
      </span>
    </header>

    <!-- 게임 진행 영역 : 후(이전)/중(현재)/전(다음·갈림길) 블록 + 캐릭터(중 블록과 겹쳐 배치) -->
    <section id="board-area" class="board-area">
      <div id="board-back" class="block block--back"></div>
      <div id="board-mid" class="block block--mid"></div>

      <!-- 전(front) : 일반 블록일 땐 right를 숨겨 단일 블록처럼, 갈림길일 땐 둘 다 표시 -->
      <div class="fork-row">
        <div id="board-front-left" class="block block--front"></div>
        <div id="board-front-right" class="block block--front"></div>
      </div>

      <!-- 캐릭터 : anchor(위치 고정) > x-track(좌우 이동) > jump(점프 아크) -->
      <div class="character-anchor">
        <div id="character-x-track" class="character-x-track">
          <div id="character-jump" class="character-jump">
            <div id="character-container" class="character-container"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 진행용 키패드 : ← / ↓(점프) / → -->
    <section class="keypad-area">
      <button type="button" class="keypad-btn keypad-btn--side" data-key="left" aria-label="왼쪽">←</button>
      <button type="button" class="keypad-btn keypad-btn--jump" data-key="jump" aria-label="점프">↓</button>
      <button type="button" class="keypad-btn keypad-btn--side" data-key="right" aria-label="오른쪽">→</button>
    </section>

  </div><!-- /.game-wrapper -->

  <!-- 오답(갈림길) 시 학습 모달 : 탭하면 닫힘, 같은 갈림길 재시도 -->
  <div id="learning-modal" class="learning-modal learning-modal--hidden">
    <div class="learning-modal__card">
      <p class="learning-modal__label">다시 한번!</p>
      <p id="learning-modal-text" class="learning-modal__text"></p>
      <p class="learning-modal__hint">화면을 탭하면 다시 도전할 수 있어요.</p>
    </div>
  </div>

  <!-- 마당 완료/실패 결과 화면 -->
  <div id="stage-result" class="stage-result stage-result--hidden">
    <div class="stage-result__card">
      <h2 id="stage-result-title" class="stage-result__title"></h2>
      <p id="stage-result-detail" class="stage-result__detail"></p>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
