<!-- v0.9.0
 Spelling Game - 마당 완료 카드를 시계 게임 result-card 레이아웃으로 교체 (성공/실패 카드 분리, 모달 키보드 닫기 대응) -->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spelling Game</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../../characters/character-anim.css" />
</head>
<body>

  <div id="game-wrapper" class="game-wrapper">

    <!-- 상단 정보 영역 : Combo(좌) / 하트(우) -->
    <header class="info-bar">
      <span class="info-bar__item info-bar__combo">
        <span class="info-bar__icon">🔥</span>
        <span id="display-combo" class="info-bar__value">0</span>
      </span>
      <span class="info-bar__item info-bar__hearts" id="display-hearts">
        <span class="heart" data-index="1">❤️</span>
        <span class="heart" data-index="2">❤️</span>
        <span class="heart" data-index="3">❤️</span>
      </span>
    </header>

    <!-- 게임 진행 영역 : 이전(back)/현재(mid)/다음(front, 갈림길 포함) 블록 + 캐릭터(현재 블록과 겹쳐 배치) -->
    <section id="board-area" class="board-area">
      <div id="board-back" class="block block--back"></div>
      <div id="board-mid" class="block block--mid"></div>

      <!-- 다음(front) : 일반 블록일 땐 right를 숨겨 단일 블록처럼, 갈림길일 땐 둘 다 표시 -->
      <div class="fork-row">
        <div id="board-front-left" class="block block--front"></div>
        <div id="board-front-right" class="block block--front"></div>
      </div>

      <!-- 캐릭터 : anchor(위치 고정) > x-track(좌우 이동) > jump(점프 아크 + 조작실수 추락) -->
      <div class="character-anchor">
        <div id="character-x-track" class="character-x-track">
          <div id="character-jump" class="character-jump">
            <div id="character-container" class="character-container"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 진행용 키패드 : ← / ↓(점프) / → -->
    <section class="keypad-area">
      <button type="button" class="keypad-btn keypad-btn--side" data-key="left" aria-label="왼쪽">←</button>
      <button type="button" class="keypad-btn keypad-btn--jump" data-key="jump" aria-label="점프">↓</button>
      <button type="button" class="keypad-btn keypad-btn--side" data-key="right" aria-label="오른쪽">→</button>
    </section>

  </div><!-- /.game-wrapper -->

  <!-- 학습 모달 : 마당 시작 시 + 갈림길 오답 시 노출. 아무 곳이나 탭하면 닫힘(오답 시엔 같은 갈림길 재시도) -->
  <!-- 콘텐츠는 주제별 문제은행 파일(data/problems/*.js)의 GUIDE 데이터를 script.js가 렌더링 -->
  <div id="learning-modal" class="learning-modal learning-modal--hidden">
    <div class="learning-modal__card">
      <p id="learning-modal-title" class="learning-modal__label"></p>
      <div id="learning-modal-text" class="learning-modal__text"></div>
      <p class="learning-modal__hint">화면을 탭하면 계속할 수 있어요.</p>
    </div>
  </div>

  <!-- 마당 완료/실패 결과 화면. 아무 곳이나 탭 또는 방향키/스페이스바로 닫힘 (실패 시엔 select 화면으로 이동 예정 - select 구현 후 연결) -->
  <div id="stage-result" class="stage-result stage-result--hidden">

    <!-- 완료(성공) 카드 : 시계 게임 result-card 레이아웃 재사용 (콤보/골드는 레이아웃만, 실제 집계는 다음 단계) -->
    <div id="stage-result-success" class="result-card">
      <h2 id="result-level" class="result-level">마당 완료!</h2>
      <p id="result-stars" class="result-stars">★★★</p>
      <p id="result-score" class="result-score">0 / 0</p>
      <p id="result-rate" class="result-rate">정답률 0%</p>
      <p id="result-combo" class="result-combo">최고 콤보 🔥 -</p>
      <hr class="result-divider" />
      <p class="result-gold-row"><span>문제 정답</span><span class="result-gold-value">💎 0</span></p>
      <p class="result-gold-row"><span>콤보 보너스</span><span class="result-gold-value">💎 0</span></p>
      <p class="result-gold-row"><span>별점 보너스</span><span class="result-gold-value">💎 0</span></p>
      <p class="result-gold-total"><span>총 획득</span><span class="result-gold-value">💎 0</span></p>
    </div>

    <!-- 실패 카드 : 통계 없이 캐릭터 + 격려 문구만 -->
    <div id="stage-result-failure" class="stage-result__card">
      <h2 id="stage-result-title" class="stage-result__title"></h2>
      <p id="stage-result-detail" class="stage-result__detail"></p>
      <div id="stage-result-character" class="stage-result__character"></div>
    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
