<!-- v0.3.0
 Spelling Game - Stage 3-1: 점프 및 키보드 조작
 - 캐릭터를 board-area 내부로 이동해 중(현재) 블록과 겹치도록 배치 (근사 배치, 정밀 동기화는 추후)
 - character-anchor(고정 위치) > character-x-track(좌우 이동, transition) > character-jump(점프 아크, animation) 3중 래퍼 -->

<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Spelling Game</title>
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="../../characters/character-anim.css" />
</head>
<body>

  <div id="game-wrapper" class="game-wrapper">

    <!-- 상단 정보 영역 : Combo(좌) / 하트(우) -->
    <header class="info-bar">
      <span class="info-bar__item info-bar__combo">
        <span class="info-bar__icon">🔥</span>
        <span id="display-combo" class="info-bar__value">0</span>
      </span>
      <span class="info-bar__item info-bar__hearts" id="display-hearts">
        <span class="heart" data-index="1">❤️</span>
        <span class="heart" data-index="2">❤️</span>
        <span class="heart" data-index="3">❤️</span>
      </span>
    </header>

    <!-- 게임 진행 영역 : 후(이전)/중(현재)/전(다음·갈림길) 블록 + 캐릭터(중 블록과 겹쳐 배치) -->
    <section id="board-area" class="board-area">
      <div class="block block--back">밥을</div>
      <div class="block block--mid">먹지</div>
      <div class="fork-row">
        <div class="block block--front">않았더니</div>
        <div class="block block--front">안았더니</div>
      </div>

      <!-- 캐릭터 : anchor(위치 고정) > x-track(좌우 이동) > jump(점프 아크) -->
      <div class="character-anchor">
        <div id="character-x-track" class="character-x-track">
          <div id="character-jump" class="character-jump">
            <div id="character-container" class="character-container"></div>
          </div>
        </div>
      </div>
    </section>

    <!-- 진행용 키패드 : ← / ↓(점프) / → -->
    <section class="keypad-area">
      <button type="button" class="keypad-btn keypad-btn--side" data-key="left" aria-label="왼쪽">←</button>
      <button type="button" class="keypad-btn keypad-btn--jump" data-key="jump" aria-label="점프">↓</button>
      <button type="button" class="keypad-btn keypad-btn--side" data-key="right" aria-label="오른쪽">→</button>
    </section>

  </div><!-- /.game-wrapper -->

  <script type="module" src="script.js"></script>
</body>
</html>
